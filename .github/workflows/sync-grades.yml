name: Sync grades

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync grade distributions
        run: bash scripts/sync-grades.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/grades/raw
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync grade distributions"
            git push
          fi